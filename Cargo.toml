[package]
name = "uorm-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Mission, mining and referral automation client for the Uorm app"

[[bin]]
name = "uorm-bot"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
